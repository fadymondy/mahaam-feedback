name: registry
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes shadcn@latest build --output ./_site/r
      # `shadcn build` exits 0 even when an item fails to resolve, so its exit code
      # proves nothing. Assert every item actually landed.
      - name: Verify every registry item was emitted
        run: |
          for item in $(node -e "process.stdout.write(require('./registry.json').items.map(i=>i.name).join(' '))"); do
            test -s "_site/r/$item.json" || { echo "missing _site/r/$item.json"; exit 1; }
            echo "ok: $item"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
